        <style>



.btn-slip-effect {
    position: relative;
    overflow: hidden
}

.btn-slip-effect .elementor-button-text,.btn-slip-effect .bokifa_btn_text {
    -ms-transition: opacity .2s,transform .2s;
    -o-transition: opacity .2s,transform .2s;
    -moz-transition: opacity .2s,transform .2s;
    -webkit-transition: opacity .2s,transform .2s;
    transition: opacity .2s,transform .2s;
    transition-timing-function: cubic-bezier(.455,.03,.515,.955)
}

.btn-slip-effect:before {
    content: attr(data-text);
    display: inline-block;
    position: absolute;
    top: 50%;
    transform: translate(0,100%);
    transition-timing-function: cubic-bezier(.455,.03,.515,.955);
    white-space: nowrap;
    opacity: 0;
    -ms-opacity: 0;
    -o-opacity: 0;
    -moz-opacity: 0;
    -webkit-opacity: 0;
    filter: alpha(opacity=0);
    -ms-transition: opacity .2s,transform .2s;
    -o-transition: opacity .2s,transform .2s;
    -moz-transition: opacity .2s,transform .2s;
    -webkit-transition: opacity .2s,transform .2s;
    transition: opacity .2s,transform .2s
}

.btn-slip-effect:hover .elementor-button-text,.btn-slip-effect:hover .bokifa_btn_text {
    transform: translateY(-150%);
    opacity: 0;
    -ms-opacity: 0;
    -o-opacity: 0;
    -moz-opacity: 0;
    -webkit-opacity: 0;
    filter: alpha(opacity=0)
}

.btn-slip-effect:hover:before {
    transform: translate(0%,-50%);
    opacity: 1;
    -ms-opacity: 1;
    -o-opacity: 1;
    -moz-opacity: 1;
    -webkit-opacity: 1;
    filter: alpha(opacity=100)
}





        .single_add_to_cart_button {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    margin-right: 12px;
    max-width: 404px;
    min-width: 180px;
    height: 50px;
    flex: 1;
    margin-bottom: 10px
}

.single_add_to_cart_button:after {
    font-size: 8px;
    font-size: .5rem;
    margin-right: 10px;
    color: #fff;
    order: -1
}

.single_add_to_cart_button:before {
    margin-right: -18px
}

button.wpcbn-btn {
    order: 100;
    max-width: 100%;
    flex: 0 0 100%;
    background-color: transparent;
    border: 1px solid yellow;
    color: yellow;
    height: 50px;
    margin-bottom: 0
}

button.wpcbn-btn:before {
    margin-right: 0
}

button.wpcbn-btn:after {
    display: none
}

button.wpcbn-btn:hover {
    background-color: green;
    border-color: green
}

button.wpcbn-btn:hover:before {
    color: red;
}

.product_title {

    letter-spacing: -2px;
    margin-bottom: 0;
    padding-top: 0;
    padding-bottom: 0;
    clear: none;

}
