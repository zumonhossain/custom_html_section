        .zooming_show_image {
        overflow: hidden;
        }
        .zooming_show_image img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        -webkit-transform: scale(var(--zoom, 1));
        -ms-transform: scale(var(--zoom, 1));
        transform: scale(var(--zoom, 1));
        -webkit-transform-origin: var(--x) var(--y);
        -ms-transform-origin: var(--x) var(--y);
        transform-origin: var(--x) var(--y);
        -webkit-transition: -webkit-transform 0.3s ease;
        transition: -webkit-transform 0.3s ease;
        -o-transition: transform 0.3s ease;
        transition: transform 0.3s ease;
        transition: transform 0.3s ease, -webkit-transform 0.3s ease;
        cursor: -webkit-zoom-in;
        cursor: zoom-in;
        aspect-ratio: 1 / 1;
        }
        .zooming_show_image:hover {
        --zoom: 3;
        border-radius: 10px;
        }
        .zoom_img_active .owl-dots {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }
        .zoom_img_active .owl-dots::-webkit-scrollbar {
        width: 5px;
        }
        .zoom_img_active .owl-dots::-webkit-scrollbar-track {
        background: #f1f1f1;
        }
        .zoom_img_active .owl-dots::-webkit-scrollbar-thumb {
        background: #888;
        }
        .zoom_img_active .owl-dots::-webkit-scrollbar-thumb:hover {
        background: #555;
        }



        .zoom_img_active .owl-dots div {
            margin: 0; /* Remove inline spacing for vertical alignment */
            border: 1px solid #ffffff;
        }

        .zoom_img_active .owl-dots img {
            width: 50px;
            height: 50px;
            cursor: pointer;
            border-radius: 5px;
            object-fit: cover; /* Ensures proper image scaling */
        }

        .zoom_img_active .owl-dots div.active {
            border: 1px solid var(--primary_color);
        }

        .zoom_img_active .owl-nav {
            position: absolute;
            width: 100%;
            top: 45%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding-left: 60px;
        }

        .zoom_img_active .owl-nav .owl-prev,
        .zoom_img_active .owl-nav .owl-next {
            pointer-events: auto;
        }
        .zoom_img_active .owl-nav {
    position: absolute;
    top: 0; /* Move to the top */
    bottom: 0; /* Extend to the bottom */
    left: 0; /* Align to the left */
    display: flex;
    flex-direction: column; /* Arrange icons vertically */
    justify-content: space-between; /* Space them at the top and bottom */
    padding: 10px; /* Add some spacing around */
    pointer-events: none; /* Disable pointer events on the container */
}

.zoom_img_active .owl-nav .owl-prev,
.zoom_img_active .owl-nav .owl-next {
    pointer-events: auto; /* Re-enable pointer events for the buttons */
    background-color: green; /* Add a semi-transparent background */
    color: white; /* Set the icon color */
    border-radius: 50%; /* Make it circular */
    width: 40px; /* Set a width for the icons */
    height: 40px; /* Set a height for the icons */
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 5px 0; /* Add some margin */
    z-index: 99999;
}

.zoom_img_active .owl-nav .owl-prev {
    order: 1; /* Place the previous button at the top */
    transform: rotate(90deg);
}

.zoom_img_active .owl-nav .owl-next {
    order: 2; /* Place the next button at the bottom */
    transform: rotate(90deg);
}
.zoom_img_active .owl-dots {
    overflow-y: auto; /* Allow vertical scrolling */
}
::-webkit-scrollbar {
  display: none; /* for Chrome, Safari, and Opera */

        <script>
            $(document).ready(function() {
                var owl = $('.zoom_img_active').owlCarousel({
                    loop: false,
                    rewind: true,
                    margin: 0,
                    items: 1,
                    dotsData: true,
                    navText: ['<i class="fa fa-angle-left"></i>', '<i class="fa fa-angle-right"></i>'],
                    nav: true,
                    dots: true,
                    autoplay: false,
                    responsive: {
                        0: {
                            items: 1
                        }
                    }
                });
                
                function centerActiveThumbnail() {
                    const activeDot = $('.zoom_img_active .owl-dot.active');
                    if (activeDot.length) {
                        activeDot[0].scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest', 
                            inline: 'center'
                        });
                    }
                }

                owl.on('changed.owl.carousel', function() {
                    centerActiveThumbnail();
                });
                centerActiveThumbnail();
            });

                    // zooming image start
        document.querySelectorAll('.zooming_show_image').forEach(elem => {
            let x, y, width, height;
            elem.onmouseenter = () => {
                const size = elem.getBoundingClientRect();

                x = size.x;
                y = size.y;

                width = size.width;
                height = size.height;
            };

            elem.onmousemove = e => {
                const horizontal = (e.clientX - x) / width * 100;
                const vertical = (e.clientY - y) / height * 100;

                elem.style.setProperty('--x', horizontal + '%');
                elem.style.setProperty('--y', vertical + '%');
            };
        });
        // zooming image end
        </script>
