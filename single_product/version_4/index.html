.zooming_show_image {
  overflow: hidden;
}
.zooming_show_image img {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  -webkit-transform: scale(var(--zoom, 1));
  -ms-transform: scale(var(--zoom, 1));
  transform: scale(var(--zoom, 1));
  -webkit-transform-origin: var(--x) var(--y);
  -ms-transform-origin: var(--x) var(--y);
  transform-origin: var(--x) var(--y);
  -webkit-transition: -webkit-transform 0.3s ease;
  transition: -webkit-transform 0.3s ease;
  -o-transition: transform 0.3s ease;
  transition: transform 0.3s ease;
  transition: transform 0.3s ease, -webkit-transform 0.3s ease;
  cursor: -webkit-zoom-in;
  cursor: zoom-in;
  aspect-ratio: 1 / 1;
}
.zooming_show_image:hover {
  --zoom: 3;
  border-radius: 10px;
}
.zoom_img_active .owl-dots img {
      width: 60px;
      height: 60px;
      cursor: pointer;
  }
  .zoom_img_active .owl-dots div {
      display: inline-block;
      /* margin-top: 4px; */
      transition: 0.7s;
      /* margin-right: 5px; */
      border: 1px solid #ffffff;
  }
  .zoom_img_active .owl-dots {
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      scroll-behavior: smooth;
  }
  .zoom_img_active .owl-dots div.active {
      /* opacity: 0.3; */
      border: 1px solid var(--primary_color);
  }
  
  .zoom_img_active .owl-dots {
    position: relative;
  }
  .youtube_video iframe {

  }
  .zooming_image_content .youtube_video {

  }
  .zooming_image_content .zoom_img_active .zooming_show_image {
    aspect-ratio: 1/1;
  }
  .video_play_icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #ffffff;
      padding: 0px 10px;
      color: #ffffff;
      font-size: 20px;
      border-radius: 3px;
      cursor: pointer;
  }
  .zoom_img_active .owl-nav .owl-prev,
  .zoom_img_active .owl-nav .owl-next {
      font-size: 20px;
      width: 20px;
      height: 20px;
      line-height: 20px;
      color: #9b9b9b;
      text-align: center;
      position: absolute;
      top: 45%;
      transform: translateY(-45%);
      opacity: 0;
      visibility: hidden;
      transition: .3s;
  }
  .zoom_img_active .owl-nav .owl-prev {
      left: 0;
  }
  .zoom_img_active .owl-nav .owl-next {
      right: 0;
  }
  .zooming_image_content:hover .zoom_img_active .owl-nav .owl-prev,
  .zooming_image_content:hover .zoom_img_active .owl-nav .owl-next {
    visibility: visible;
    opacity: 1;
  }
  .zoom_img_active .owl-dots div .video_icon_overlay::after {
    content: "\f04b";

    padding: 0px 11px;
    border-radius: 5px;
    font-size: 16px;
    border: 2px solid #ffffff;
    font-weight: 600;

        <script>
            $(document).ready(function() {
                var owl = $('.zoom_img_active').owlCarousel({
                    loop: false,
                    rewind: true,
                    margin: 0,
                    items: 1,
                    dotsData: true,
                    navText: ['<i class="fa fa-angle-left"></i>', '<i class="fa fa-angle-right"></i>'],
                    nav: true,
                    dots: true,
                    autoplay: false,
                    responsive: {
                        0: {
                            items: 1
                        }
                    }
                });
                
                function centerActiveThumbnail() {
                    const activeDot = $('.zoom_img_active .owl-dot.active');
                    if (activeDot.length) {
                        activeDot[0].scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest', 
                            inline: 'center'
                        });
                    }
                }

                owl.on('changed.owl.carousel', function() {
                    centerActiveThumbnail();
                });
                centerActiveThumbnail();
            });

                    // zooming image start
        document.querySelectorAll('.zooming_show_image').forEach(elem => {
            let x, y, width, height;
            elem.onmouseenter = () => {
                const size = elem.getBoundingClientRect();

                x = size.x;
                y = size.y;

                width = size.width;
                height = size.height;
            };

            elem.onmousemove = e => {
                const horizontal = (e.clientX - x) / width * 100;
                const vertical = (e.clientY - y) / height * 100;

                elem.style.setProperty('--x', horizontal + '%');
                elem.style.setProperty('--y', vertical + '%');
            };
        });
        // zooming image end
        </script>
