<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fly to Cart</title>

  <!-- CSS Libraries -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/fontawesome.min.css" />

  <!-- Custom Style -->
  <style>
    .cart_fly_icon {
      position: fixed;
      top: 20%;
      right: 29px;
      z-index: 1000;
    }

    .fly-clone {
      position: fixed;
      width: 150px;
      height: 150px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 9999;
      pointer-events: none;
      transition: all 0.8s ease-in-out;
    }

    .imagee_big {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <!-- Product Section -->
  <div class="container py-4">
    <div class="cart_fly_icon">
      <i id="cart_fly_icon" class="fas fa-shopping-cart fa-2x"></i>
    </div>

    <div class="row g-4">

      <div class="col-3">
        <div class="item">
          <img class="imagee_big" src="https://pokemon.wingzero.tw/assets/pokemon/387.png" alt="Turtwig" />
        </div>
        <button class="btn btn-info mt-2 add-to-cart"><i class="fas fa-cart-plus"></i></button>
      </div>

    </div>
  </div>

  <!-- JS Libraries -->
  <script src="assets/js/jquery-3.6.3.min.js"></script>
  <script src="assets/js/bootstrap.min.js"></script>

  <!-- Custom Script -->
  <script>
    $(function () {
      const $cart = $('#cart_fly_icon');

      $('.add-to-cart').on('click', function () {
        // Get image inside the previous sibling .item
        const $img = $(this).prev('.item').find('img');
        const imgSrc = $img.attr('src');
        const start = $img.offset();
        const end = $cart.offset();

        const $clone = $('<div class="fly-clone"></div>').css({
          backgroundImage: `url('${imgSrc}')`,
          top: start.top + 'px',
          left: start.left + 'px'
        }).appendTo('body');

        $clone[0].offsetWidth; // trigger reflow

        $clone.css({
          top: end.top + 'px',
          left: end.left + 'px',
          width: '20px',
          height: '20px',
          opacity: 0.5
        });

        setTimeout(() => {
          $clone.remove();
        }, 800);
      });
    });
  </script>

</body>
</html>
